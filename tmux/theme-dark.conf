# Catppuccin Mocha (Dark)
set -g mode-style "fg=#89b4fa,bg=#313244"
set -g message-style "fg=#89b4fa,bg=#313244"
set -g message-command-style "fg=#89b4fa,bg=#313244"
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g status-style "fg=#89b4fa,bg=#181825"
set -g status-right "#[fg=#cba6f3,bg=#181825,nobold,nounderscore,noitalics]#[fg=#11111b,bg=#cba6f3]#($HOME/dotfiles/tmux/status_time.sh) "
setw -g window-status-activity-style "underscore,fg=#bac2de,bg=#181825"
setw -g window-status-style "NONE,fg=#bac2de,bg=#313244"
setw -g window-status-format "#[fg=#11111b,bg=#8f98ad]#[fg=#181825,reverse]#[none]#I #[fg=#bac2de,bg=#313347] #W #[fg=#181825,reverse]#[none]"
setw -g window-status-current-format "#[fg=#11111b,bg=#cba6f3]#[fg=#181825,reverse]#[none]#I #[fg=#cdd6f4,bg=#484758,bold] #W #[fg=#181825,reverse]#[none]"
